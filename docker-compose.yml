version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: erka_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: erka_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Spring Boot Backend
  backend:
    build: ./backend
    container_name: erka_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/erka_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      JWT_SECRET: ThisIsAVeryLongSecretKeyForJWTTokenGenerationPurposeRequiredForSecurity
      JWT_EXPIRATION_MS: 86400000
    depends_on:
      - db

  # Next.js Frontend
  frontend:
    # Assuming the frontend Dockerfile is in ./frontend directory
    # If the folder doesn't exist, this will fail during build, but that's expected
    # based on the prompt instructions to assume it exists.
    # We use context: ./frontend if it existed.
    # Since I don't have the frontend code, I will comment out the build context
    # and use a placeholder image or assume the user will provide the context.
    # However, the user asked to UPDATE the docker-compose to include it.
    # I will assume the standard `build: ./frontend` configuration.
    build: ./frontend
    container_name: erka_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
    depends_on:
      - backend

volumes:
  postgres_data:
